<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Torra | E-commerce e Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i>
            <span>Café Torra</span>
        </div>
        <div class="user-actions">
            <button id="btn-carrinho" onclick="toggleCarrinho()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="contador-carrinho">0</span>
            </button>
        </div>
    </header>

    <main class="container-vitrine">
        <h2>Vitrine de Cafés Especiais</h2>
        <div class="grid-produtos" id="grid-produtos"></div>
    </main>

    <section class="container-avaliacao">
        <h2>Avalie sua Experiência</h2>
        <div class="form-avaliacao">
            <p>O café chegou quente e no ponto ideal?</p>
            <div class="estrelas" id="grupo-estrelas">
                <i class="fa-solid fa-star selecionada" onclick="selecionarEstrela(1)"></i>
                <i class="fa-solid fa-star selecionada" onclick="selecionarEstrela(2)"></i>
                <i class="fa-solid fa-star selecionada" onclick="selecionarEstrela(3)"></i>
                <i class="fa-solid fa-star selecionada" onclick="selecionarEstrela(4)"></i>
                <i class="fa-solid fa-star selecionada" onclick="selecionarEstrela(5)"></i>
            </div>
            <textarea id="comentario-aval" placeholder="Escreva seu comentário..."></textarea>
            <button class="btn-enviar-aval" onclick="enviarAvaliacao()">Enviar Avaliação</button>
        </div>
    </section>

    <div class="drawer-carrinho" id="drawer-carrinho">
        <div class="drawer-header">
            <h3>Seu Carrinho</h3>
            <button onclick="toggleCarrinho()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-items" id="drawer-items"></div>
        <div class="drawer-footer">
            <p>Total: <span id="val-total">R$ 15,00</span></p>
            <button class="btn-checkout" onclick="finalizarCheckout()">Finalizar (Pix)</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Café Torra | Larissa Amanda (RGM: 35741775)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
